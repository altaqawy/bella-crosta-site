<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bella Crosta | Order Pizza in Obour</title>
    <meta
      name="description"
      content="Order Bella Crosta artisan pizza in Obour, reserve pickup, view offers, track order status, and contact the restaurant by WhatsApp."
    />
    <meta property="og:title" content="Bella Crosta" />
    <meta property="og:description" content="French Passion. Egyptian Heart. Italian Crust." />
    <meta property="og:image" content="./assets/bella-crosta/pizza_pepperoni_transparent.png" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="site-header" aria-label="Bella Crosta navigation">
      <a class="brand-lockup" href="#home" aria-label="Bella Crosta home">
        <img src="./assets/bella-crosta/bella_crosta_logo_transparent.png" alt="Bella Crosta logo" />
        <span>Bella Crosta</span>
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="#home" data-nav="home">Home</a>
        <a href="#menu" data-nav="menu">Menu</a>
        <a href="#offers" data-nav="offers">Offers</a>
        <a href="#reserve" data-nav="reserve">Reserve</a>
        <a href="#track" data-nav="track">Track</a>
        <a href="#contact" data-nav="contact">Contact</a>
        <a href="#admin" data-nav="admin">Admin</a>
      </nav>

      <div class="header-actions">
        <button class="cart-button" type="button" data-open-cart aria-label="Open cart">
          Cart <span data-cart-count>0</span>
        </button>
        <a class="header-order" href="https://wa.me/201031252519" target="_blank" rel="noreferrer">WhatsApp</a>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a href="#home" data-nav="home" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z" /></svg>
      </a>
      <a href="#menu" data-nav="menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z" /></svg>
      </a>
      <button type="button" data-open-cart aria-label="Open cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4m10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4M4.3 4H2V2h3.7l1.1 3H22l-2.2 9H7.2z" /></svg>
        <span data-cart-count>0</span>
      </button>
      <a href="https://wa.me/201031252519" target="_blank" rel="noreferrer" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a9.8 9.8 0 0 0-8.5 14.8L2 22l5.4-1.4A9.9 9.9 0 1 0 12 2m0 2a7.9 7.9 0 0 1 0 15.8 8 8 0 0 1-4-1.1l-.4-.2-2.7.7.7-2.6-.3-.4A7.8 7.8 0 0 1 12 4m-3.1 4.2c-.2 0-.5.1-.7.4s-.9.9-.9 2.2 1 2.6 1.1 2.8c.2.2 1.9 3 4.7 4 .7.2 1.2.4 1.6.4.7.1 1.3.1 1.8-.1.6-.2 1.7-.8 1.9-1.5.2-.7.2-1.3.1-1.5s-.2-.2-.5-.4l-1.8-.9c-.3-.1-.4-.2-.6.2l-.8 1c-.1.2-.3.2-.6.1a6.4 6.4 0 0 1-3.1-2.7c-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.8-1.9c-.2-.4-.4-.4-.6-.4z" /></svg>
      </a>
    </nav>

    <aside class="cart-drawer" id="cartDrawer" aria-label="Cart" aria-hidden="true">
      <div class="drawer-panel">
        <div class="drawer-head">
          <div>
            <p class="eyebrow">Cart</p>
            <h2>Your order</h2>
          </div>
          <button class="icon-button" type="button" data-close-cart aria-label="Close cart">x</button>
        </div>
        <div id="cartContent"></div>
      </div>
    </aside>

    <div class="modal-layer" id="modalLayer" aria-hidden="true"></div>
    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
